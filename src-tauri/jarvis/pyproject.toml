[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "aijarvis-backend"
version = "0.1.2"
description = "Local-first AI Jarvis control plane"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1",
  "hf-xet>=1.1,<2",
  "huggingface-hub>=0.30,<2",
  "pydantic>=2.10,<3",
  "pydantic-settings>=2.7,<3",
  "tqdm>=4.65,<5",
  "uvicorn[standard]>=0.34,<1",
]

[project.optional-dependencies]
test = [
  "httpx>=0.28,<1",
  "pytest>=8.3,<9",
  "pytest-asyncio>=0.25,<1",
]
llm = ["anthropic>=0.116,<1"]
packaging = ["pyinstaller>=6.14,<7"]

[project.scripts]
jarvis-backend = "jarvis_backend.app:run"

[tool.hatch.build.targets.wheel]
packages = ["python/src/jarvis_backend"]

[tool.hatch.build.targets.sdist]
include = [
  "/python/src",
  "/python/config",
  "/README.md",
  "/LICENSE",
  "/THIRD_PARTY_NOTICES.md",
]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests/unit"]
asyncio_mode = "auto"

[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = ["third_party/runtime/vendor"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]
