[package]
name = "e-assisant"
version = "0.1.0"
description = "E-Assisant - Local-first Windows Desktop AI Agent"
authors = ["E-Assisant Team"]
license = "AGPL-3.0-or-later"
edition = "2021"
rust-version = "1.77"

[lib]
name = "e_assisant_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# === Tauri 2 核心 ===
# 只启用必需 feature，避免编译不需要的模块
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-dialog = "2"  # 文件选择/消息框，体积小且必需
tauri-plugin-global-shortcut = "2"  # 全局快捷键
tauri-plugin-notification = "2"  # 系统通知（托盘气泡）

# === 数据库 ===
# bundled: 编译时自带 SQLite，避免系统依赖
rusqlite = { version = "0.31", features = ["bundled"] }

# === 序列化 ===
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# === 异步运行时 ===
# 最小 feature 集：多线程运行时、宏、同步原语、时间
# net / io-util 给多端网关（本地带鉴权的 HTTP 服务）用：只开这两项，
# 不引入 hyper/axum 这类整套框架——网关只有 4 个端点，手写 HTTP 报文更小更可控。
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "net", "io-util"] }

# === 工具库 ===
thiserror = "1"       # 错误类型定义（零运行时开销，仅编译期宏）
async-trait = "0.1"   # trait 中 async fn 支持（轻量 proc macro）
uuid = { version = "1", features = ["v4", "serde"] }  # 会话ID生成
sha2 = "0.10"        # 用户输入哈希（审计日志用）
sha1 = "0.10"        # 网页发布时给 Netlify 报文件摘要（它的 digest 接口要 SHA-1）
dirs = "5"           # 获取系统目录（APPDATA 等）
chrono = { version = "0.4", features = ["clock", "serde"] }  # 时间处理
dunce = "1"           # Windows 路径规范化（去除 UNC 前缀）

# === HTTP 客户端 ===
# 与 Ollama 本地服务通信，流式 SSE 解析
# 注意：reqwest 默认会读取 HTTP_PROXY / HTTPS_PROXY 环境变量。发布通道那边已显式
#       no_proxy()，否则一旦进程继承了别处注入的代理变量，就会连到不存在的代理上。
# blocking 仅供 examples/ 下的端到端验证探针使用（一次性工具，不进产品链路）。
reqwest = { version = "0.12", features = ["json", "stream", "blocking", "multipart"] }

# === 邮件（SMTP 发送）===
# 只开 SMTP 传输 + rustls：不走 native-tls，避免不同机器上 OpenSSL/SChannel 行为差异。
# 不带 pool：这里一次只发一封信，连接池只会多留线程。
lettre = { version = "0.11", default-features = false, features = ["smtp-transport", "rustls-tls", "builder", "hostname"] }
# === 邮件（IMAP 收件）===
# SMTP 只能发不能收，收件必须走 IMAP——这是唯一一个"换服务商只改 host/密码"
# 就能通吃 Gmail/Outlook/QQ/163/自建 Dovecot 的标准协议。
# 用 imap 2.x + native-tls（Windows 上走 SChannel，不碰 OpenSSL，不会重演
# STATUS_ENTRYPOINT_NOT_FOUND 那类原生符号问题），并显式引入 native-tls
# 以拿到 TlsConnector（imap 不 re-export 它）。
imap = "2.4.1"
native-tls = "0.2"
# 邮件头里的 GBK/GB2312 编码主题需要转码；encoding_rs 已在 reqwest 依赖树里，
# 提升为直接依赖不会新增下载量。
encoding_rs = "0.8"

# === 流处理 ===
# tokio::sync::mpsc 的 Stream 包装
tokio-stream = { version = "0.1", features = ["sync"] }

# === V19 Browser: WebSocket CDP 通信 ===
tokio-tungstenite = "0.24"
futures-util = "0.3"
base64 = "0.22"

# === V20 Skills: URL 编码 ===
urlencoding = "2"

# === Windows API ===
# Win32_UI_WindowsAndMessaging：浮窗拖动（WM_NCHITTEST 返回 HTCAPTION）+ 屏幕尺寸
# Win32_UI_Input_KeyboardAndMouse：键鼠模拟（SendInput）。走 crate 而不是 PowerShell，
#   因为一次点击起一个 PowerShell 进程要 150ms 以上，连续操作完全不可用。
windows = { version = "0.52", features = [
    "Win32_Foundation",
    "Win32_System_Pipes",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Input_KeyboardAndMouse",
    # OCR 走系统自带的 Windows.Media.Ocr（WinRT）：不引 tesseract，
    # 用户不用额外装引擎，中英混排开箱可用。
    "Foundation",
    "Foundation_Collections",
    "Globalization",
    "Graphics_Imaging",
    "Storage",
    "Storage_Streams",
    "Media_Ocr",
] }
raw-window-handle = "0.6"
lopdf = "0.34"

# === JS 沙箱（纯 Rust ES 引擎）===
# code_execution 用：隔离堆，无 fs/network/require，只做纯计算/数据变换。
# 选纯 Rust 引擎（Boa）而非 C 绑定 QuickJS，避免再引入原生链接（此前
# STATUS_ENTRYPOINT_NOT_FOUND 的教训：原生链接会把运行时符号拖进测试二进制）。
boa_engine = "0.21"

[package.metadata.tauri]
# Tauri 构建元数据（桌面应用最小配置）

[package.metadata.tauri-winres]
# Windows 资源文件元数据（最小配置，防止构建失败）

[features]
# 默认不开启任何额外 feature
default = []

# 开发模式：启用日志和调试断言
dev = []

[profile.release]
opt-level = "z"      # 优化体积优先（极致最小体积）
lto = true           # 链接时优化
codegen-units = 1    # 单代码生成单元（更慢但更小）
panic = "abort"      # 去掉 panic 展开代码
strip = true         # 剥离调试符号
